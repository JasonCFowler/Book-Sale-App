<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Sale Pricing App — SEBTS Library</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Special+Elite&family=Courier+Prime:ital@0;1&display=swap');

  :root{
    --paper: #F1EADA;
    --paper-deep: #E7DCC3;
    --card: #FBF7EC;
    --ink: #2A2420;
    --ink-soft: #574C40;
    --rule: #C9BB9E;
    --rail: #8B7A5E;
    --stamp-red: #A3402B;
    --stamp-teal: #3D5B4E;
    --gold: #A9822F;
    --price-1: #E0332F;
    --price-5: #F07D1B;
    --price-10: #F5C518;
    --price-20: #3FA34D;
    --price-30: #2F7CD6;
    --price-manual: #8B5CF6;
    --focus: #2F5D4F;
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Source Serif 4', Georgia, serif;
    min-height:100vh;
  }

  body{
    background-image:
      radial-gradient(ellipse at top left, rgba(169,130,47,0.06), transparent 60%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 1px, transparent 1px, transparent 3px);
  }

  .wrap{
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  /* ---------- Header: the drawer label ---------- */
  header{
    padding: 46px 0 22px;
    text-align:center;
    position:relative;
  }
  .eyebrow{
    font-family:'Special Elite', 'Courier Prime', monospace;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    font-size: 12px;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  h1{
    font-size: clamp(34px, 5vw, 54px);
    font-weight: 700;
    margin: 0;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  h1 em{
    font-style: italic;
    font-weight: 400;
    color: var(--stamp-teal);
  }
  .subhead{
    margin-top: 10px;
    font-size: 15px;
    color: var(--ink-soft);
    font-family:'Special Elite', monospace;
    letter-spacing:0.02em;
  }
  .drawer-rail{
    height: 10px;
    margin: 28px auto 0;
    max-width: 560px;
    background: linear-gradient(180deg, var(--rail), #6b5d43);
    border-radius: 3px;
    box-shadow: 0 2px 0 rgba(0,0,0,0.25) inset, 0 3px 4px rgba(0,0,0,0.2);
  }

  /* ---------- Search block ---------- */
  .search-block{
    margin-top: 30px;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 4px;
    box-shadow: 0 10px 24px -12px rgba(42,36,32,0.35), 0 1px 0 rgba(255,255,255,0.4) inset;
    padding: 22px 22px 16px;
    position: relative;
  }
  .search-block::before{
    content:"";
    position:absolute; top:-9px; left:50%;
    transform: translateX(-50%);
    width: 18px; height:18px;
    background: var(--paper);
    border: 1px solid var(--rule);
    border-radius:50%;
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.25);
  }

  .search-row{
    display:flex;
    gap: 10px;
    align-items:center;
  }
  .search-icon{
    width: 20px; height:20px; flex:0 0 auto;
    color: var(--ink-soft);
  }
  #searchInput{
    flex: 1 1 auto;
    font-family:'Source Serif 4', Georgia, serif;
    font-size: 19px;
    padding: 12px 4px;
    border: none;
    border-bottom: 2px solid var(--rule);
    background: transparent;
    color: var(--ink);
    outline: none;
    transition: border-color .15s ease;
  }
  #searchInput::placeholder{ color:#A79A85; font-style: italic; }
  #searchInput:focus{ border-bottom-color: var(--focus); }
  #searchInput:focus-visible{ outline: 2px solid var(--focus); outline-offset: 3px; border-radius:2px; }

  .meta-row{
    display:flex;
    justify-content: space-between;
    align-items:baseline;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    font-family:'Special Elite', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  #resultCount b{ color: var(--stamp-teal); font-weight:400; }
  .field-hint{ opacity:0.75; }

  /* ---------- Results ---------- */
  #results{
    margin-top: 34px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 22px;
  }

  .card{
    position:relative;
    background: var(--card);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 20px 18px 18px;
    box-shadow: 0 6px 14px -8px rgba(42,36,32,0.3);
    transition: transform .12s ease, box-shadow .12s ease;
    animation: rise .28s ease both;
  }
  .card:hover{
    transform: translateY(-2px);
    box-shadow: 0 12px 22px -10px rgba(42,36,32,0.4);
  }
  @keyframes rise{
    from{ opacity:0; transform: translateY(6px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .card::before{ /* punch hole */
    content:"";
    position:absolute; top:10px; left:50%;
    transform: translateX(-50%);
    width:10px; height:10px;
    border-radius:50%;
    background: var(--paper);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.3), 0 0 0 1px var(--rule);
  }

  .card-cat{
    font-family:'Special Elite', monospace;
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--stamp-teal);
    margin-top: 8px;
    margin-bottom: 6px;
  }

  .card-title{
    font-size: 17px;
    font-weight: 700;
    line-height: 1.28;
    color: var(--ink);
    margin: 0 0 4px;
  }
  .card-author{
    font-style: italic;
    color: var(--ink-soft);
    font-size: 14px;
    margin-bottom: 12px;
  }

  .card-details{
    font-family:'Courier Prime', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    line-height: 1.75;
  }
  .card-details .row{ display:flex; justify-content:space-between; gap:10px; }
  .card-details .lbl{ color:#93876F; }
  .card-details .val{ text-align:right; }

  .set-flag{
    display:inline-block;
    margin-top: 8px;
    font-family:'Special Elite', monospace;
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--stamp-red);
    border: 1px solid var(--stamp-red);
    padding: 2px 7px;
    border-radius: 2px;
    transform: rotate(-1.2deg);
  }

  .amazon-link{
    display:inline-flex;
    align-items:center;
    gap: 5px;
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px dashed var(--rule);
    width: 100%;
    font-family:'Special Elite', monospace;
    font-size: 11px;
    letter-spacing: 0.02em;
    color: var(--stamp-teal);
    text-decoration: none;
  }
  .amazon-link:hover{ color: var(--focus); text-decoration: underline; }
  .amazon-link svg{ width: 11px; height: 11px; flex: 0 0 auto; }

  .price-stamp{
    position:absolute;
    top: 14px; right: 14px;
    width: 56px; height:56px;
    border-radius: 50%;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform: rotate(6deg);
    font-family: 'Source Serif 4', Georgia, serif;
    line-height: 1;
    color: #fff;
    background: var(--price-manual);
    box-shadow:
      0 3px 6px rgba(0,0,0,0.35),
      0 1px 0 rgba(255,255,255,0.5) inset,
      0 -6px 10px rgba(0,0,0,0.15) inset;
    border: 1px solid rgba(0,0,0,0.08);
  }
  .price-stamp::after{
    content:"";
    position:absolute;
    top: 4px; left: 8px;
    width: 60%; height: 38%;
    border-radius: 50%;
    background: linear-gradient(200deg, rgba(255,255,255,0.75), rgba(255,255,255,0) 70%);
    pointer-events:none;
  }
  .price-stamp .amt{ font-size: 17px; font-weight:700; text-shadow: 0 1px 1px rgba(0,0,0,0.15); }
  .price-stamp .cur{ font-size: 7.5px; letter-spacing:0.08em; margin-top:1px; opacity:0.9; }
  .price-stamp.manual{ background: var(--price-manual); }
  .price-stamp.manual .amt{ font-size: 13px; letter-spacing:0.01em; padding: 0 4px; text-align:center; }

  .price-stamp.p-1{ background: var(--price-1); }
  .price-stamp.p-5{ background: var(--price-5); }
  .price-stamp.p-10{ background: var(--price-10); color:#4A3B00; }
  .price-stamp.p-10 .amt{ text-shadow:none; }
  .price-stamp.p-20{ background: var(--price-20); }
  .price-stamp.p-30{ background: var(--price-30); }

  .price-key{
    margin-top: 16px;
    display:flex;
    flex-wrap: wrap;
    gap: 8px 10px;
    justify-content:center;
    font-family:'Special Elite', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.03em;
  }
  .price-key button{
    display:inline-flex; align-items:center; gap:6px;
    font-family: inherit;
    font-size: inherit;
    letter-spacing: inherit;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 20px;
    padding: 4px 10px 4px 8px;
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease, transform .12s ease;
  }
  .price-key button:hover{
    background: var(--paper-deep);
    transform: translateY(-1px);
  }
  .price-key button:focus-visible{
    outline: 2px solid var(--focus);
    outline-offset: 1px;
  }
  .price-key button.active{
    background: var(--card);
    border-color: currentColor;
    color: var(--ink);
    font-weight: 700;
    box-shadow: 0 2px 5px -2px rgba(42,36,32,0.4);
  }
  .price-key .dot{
    width:13px; height:13px; border-radius:50%;
    display:inline-block;
    box-shadow: 0 1px 2px rgba(0,0,0,0.35), 0 1px 0 rgba(255,255,255,0.5) inset;
  }
  .price-key .p-1 .dot{ background: var(--price-1); }
  .price-key .p-5 .dot{ background: var(--price-5); }
  .price-key .p-10 .dot{ background: var(--price-10); }
  .price-key .p-20 .dot{ background: var(--price-20); }
  .price-key .p-30 .dot{ background: var(--price-30); }
  .price-key .manual .dot{ background: var(--price-manual); }

  /* ---------- Empty / initial states ---------- */
  .state-msg{
    grid-column: 1 / -1;
    text-align:center;
    padding: 70px 20px;
    color: var(--ink-soft);
  }
  .state-msg .glyph{
    font-size: 34px;
    margin-bottom: 14px;
    opacity:0.6;
  }
  .state-msg h3{
    font-family:'Source Serif 4', Georgia, serif;
    font-size: 20px;
    margin: 0 0 6px;
    color: var(--ink);
  }
  .state-msg p{
    font-family:'Special Elite', monospace;
    font-size: 12.5px;
    margin:0;
    max-width: 420px;
    margin-left:auto; margin-right:auto;
    line-height:1.6;
  }

  footer{
    text-align:center;
    margin-top: 60px;
    padding-top: 18px;
    border-top: 1px dashed var(--rule);
    font-family:'Special Elite', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    letter-spacing: 0.04em;
  }

  @media (prefers-reduced-motion: reduce){
    .card{ animation: none; }
    .card, .card:hover{ transition:none; transform:none; }
  }

  @media (max-width: 520px){
    #results{ grid-template-columns: 1fr; }
    header{ padding-top: 30px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="eyebrow">SEBTS Library</div>
    <h1>Book Sale <em>Card Catalog</em></h1>
    <div class="subhead">search by title, author, or ISBN</div>
    <div class="drawer-rail"></div>
  </header>

  <div class="search-block">
    <div class="search-row">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
      <input id="searchInput" type="text" placeholder="e.g. “Crazy Love”, “Chan, Francis”, or 9781434768513" autocomplete="off" spellcheck="false">
    </div>
    <div class="meta-row">
      <span id="resultCount">Loading catalog…</span>
      <span class="field-hint">title · author · ISBN</span>
    </div>
  </div>

  <div class="price-key" id="priceKey">
    <button class="p-1" data-tier="p-1" type="button"><span class="dot"></span>$1</button>
    <button class="p-5" data-tier="p-5" type="button"><span class="dot"></span>$5</button>
    <button class="p-10" data-tier="p-10" type="button"><span class="dot"></span>$10</button>
    <button class="p-20" data-tier="p-20" type="button"><span class="dot"></span>$20</button>
    <button class="p-30" data-tier="p-30" type="button"><span class="dot"></span>$30</button>
    <button class="manual" data-tier="manual" type="button"><span class="dot"></span>manual</button>
  </div>

  <div id="results"></div>

  <footer>SEBTS Library · Book Sale Pricing — offline dataset, browser-side search</footer>
</div>

const resultsEl = document.getElementById('results');
const inputEl = document.getElementById('searchInput');
const countEl = document.getElementById('resultCount');

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtPrice(book){
  if(book.priceRaw){
    // Extract a short display value like "~$60" from text such as "Price Manually: ~$60".
    const match = book.priceRaw.match(/~?\$[\d,]+(\.\d+)?/);
    const short = match ? match[0] : 'Manual';
    return {cls:'manual', html: escapeHtml(short), title: escapeHtml(book.priceRaw)};
  }
  if(book.price === null || book.price === undefined){
    return {cls:'manual', html: 'N/A', title: 'No price on record'};
  }
  const n = book.price;
  const str = (n % 1 === 0) ? n.toFixed(0) : n.toFixed(2).replace(/0$/,'');
  const tierMap = {1:'p-1', 5:'p-5', 10:'p-10', 20:'p-20', 30:'p-30'};
  const cls = tierMap[Math.round(n)] || 'manual';
  return {cls, html: str, title: null};
}

function amazonLink(b){
  // Prefer the direct Amazon product link supplied in the spreadsheet.
  if(b.amazonUrl) return b.amazonUrl;

  // Fall back to an ISBN-based search if no direct link is present.
  const isbn13 = b.isbns.find(i => i.replace(/-/g,'').length === 13);
  const isbn10 = b.isbns.find(i => i.replace(/-/g,'').length === 10);
  const isbn = (isbn13 || isbn10 || '').replace(/-/g,'');
  if(isbn) return `https://www.amazon.com/s?k=${encodeURIComponent(isbn)}`;

  // No ISBN on record — fall back to a title + author text search.
  const query = [b.title, b.author].filter(Boolean).join(' ').trim();
  if(!query) return null;
  return `https://www.amazon.com/s?k=${encodeURIComponent(query)}`;
}

function renderCard(b){
  const author = [b.author, b.secAuthor].filter(Boolean).join(' & ') || 'Unknown author';
  const price = fmtPrice(b);
  const setFlag = b.setFlag ? `<span class="set-flag">${escapeHtml(b.setFlag)}</span>` : '';
  const azLink = amazonLink(b);
  const amazonHtml = azLink ? `
      <a class="amazon-link" href="${azLink}" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"></path><polyline points="15 3 21 3 21 9"></polyline><line x1="10" y1="14" x2="21" y2="3"></line></svg>
        Check price on Amazon
      </a>` : '';
  return `
    <div class="card">
      <div class="price-stamp ${price.cls}"${price.title ? ` title="${price.title}"` : ''}>
        <span class="amt">${price.cls==='manual' ? price.html : '$'+price.html}</span>
        ${price.cls!=='manual' ? '<span class="cur">USD</span>' : ''}
      </div>
      <div class="card-cat">${escapeHtml(b.category || 'Uncategorized')}</div>
      <div class="card-title">${escapeHtml(b.title)}</div>
      <div class="card-author">${escapeHtml(author)}</div>
      <div class="card-details">
        <div class="row"><span class="lbl">Publisher</span><span class="val">${escapeHtml(b.publisher || '—')}</span></div>
        <div class="row"><span class="lbl">Year</span><span class="val">${escapeHtml(b.year || '—')}</span></div>
      </div>
      ${setFlag}
      ${amazonHtml}
    </div>
  `;
}

function emptyState(kind){
  if(kind === 'initial'){
    return `<div class="state-msg">
      <div class="glyph">✦</div>
      <h3>${BOOKS.length.toLocaleString()} volumes on the shelf</h3>
      <p>Start typing a title, an author's last name, or an ISBN to pull a card.</p>
    </div>`;
  }
  return `<div class="state-msg">
    <div class="glyph">—</div>
    <h3>No match found</h3>
    <p>Nothing in the catalog matches that search. Try a shorter title fragment or check the ISBN digits.</p>
  </div>`;
}

function normalize(s){
  return (s || '').toString().toLowerCase();
}

function tierOf(book){
  if(book.priceRaw || book.price === null || book.price === undefined) return 'manual';
  const tierMap = {1:'p-1', 5:'p-5', 10:'p-10', 20:'p-20', 30:'p-30'};
  return tierMap[Math.round(book.price)] || 'manual';
}

function textSearch(query){
  const q = normalize(query).trim();
  if(!q) return null;
  const qDigits = q.replace(/[^0-9x]/g,'');
  const isIsbnLike = qDigits.length >= 4 && qDigits.length === q.replace(/\s|-/g,'').length;

  return BOOKS.filter(b => {
    if(isIsbnLike && qDigits.length >= 4){
      if(b.isbns.some(isbn => isbn.replace(/-/g,'').toLowerCase().includes(qDigits))) return true;
    }
    if(normalize(b.title).includes(q)) return true;
    if(normalize(b.author).includes(q)) return true;
    if(normalize(b.secAuthor).includes(q)) return true;
    return false;
  });
}

let activeTier = null;

const MAX_RENDER = 200;

function updateKeyButtons(){
  document.querySelectorAll('#priceKey button').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tier === activeTier);
  });
}

function render(){
  const q = inputEl.value;
  const textMatches = textSearch(q);

  let base = textMatches === null ? BOOKS.slice() : textMatches;
  let matches = activeTier ? base.filter(b => tierOf(b) === activeTier) : base;

  const noQueryAtAll = textMatches === null && !activeTier;

  if(noQueryAtAll){
    resultsEl.innerHTML = emptyState('initial');
    countEl.innerHTML = `<b>${BOOKS.length.toLocaleString()}</b> volumes catalogued`;
    return;
  }

  if(matches.length === 0){
    resultsEl.innerHTML = emptyState('empty');
    countEl.innerHTML = `<b>0</b> matches${q ? ` for “${escapeHtml(q)}”` : ''}`;
    return;
  }

  const shown = matches.slice(0, MAX_RENDER);
  resultsEl.innerHTML = shown.map(renderCard).join('');
  const label = q ? ` for “${escapeHtml(q)}”` : '';
  countEl.innerHTML = matches.length > MAX_RENDER
    ? `<b>${matches.length.toLocaleString()}</b> matches${label} — showing first ${MAX_RENDER}`
    : `<b>${matches.length.toLocaleString()}</b> match${matches.length===1?'':'es'}${label}`;
}

let debounceTimer;
inputEl.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(render, 90);
});

document.getElementById('priceKey').addEventListener('click', (e) => {
  const btn = e.target.closest('button');
  if(!btn) return;
  const tier = btn.dataset.tier;
  activeTier = (activeTier === tier) ? null : tier;
  updateKeyButtons();
  render();
});

render();
</script>
